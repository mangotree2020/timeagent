appId: com.timeagent.app
name: H-01 첫 일정 계획 확정과 예약 저장
tags:
  - smoke
  - android
---
- launchApp:
    clearState: true
    permissions:
      all: deny
      android.permission.ACCESS_FINE_LOCATION: allow
      android.permission.ACCESS_COARSE_LOCATION: allow
- extendedWaitUntil:
    visible: "언제 준비해야 할지.*"
    timeout: 15000
- assertVisible: "TimeAgent"
- tapOn: "다음"
- assertVisible: "현재 속도에 맞춰.*"
- tapOn: "다음"
- assertVisible: "현위치와 경로를 보고.*"
- tapOn: "첫 일정 만들기"
- extendedWaitUntil:
    visible: "새 일정 만들기"
    timeout: 10000
- assertVisible: "언제, 어디에서 만나나요?"
- scrollUntilVisible:
    element:
      text: "다음"
    direction: DOWN
- tapOn: "다음"
- assertVisible: "어떻게 이동할까요?"
- tapOn: "택시"
- scrollUntilVisible:
    element:
      text: "다음"
    direction: DOWN
- tapOn: "다음"
- assertVisible: "무엇을 준비해야 하나요?"
- scrollUntilVisible:
    element:
      text: "AI 계획 만들기"
    direction: DOWN
- tapOn: "AI 계획 만들기"
- extendedWaitUntil:
    visible: "준비 계획을 확인해 주세요"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "택시로 출발"
    direction: DOWN
- assertVisible: "택시로 출발"
- scrollUntilVisible:
    element:
      text: "계획 확정"
    direction: DOWN
- assertNotVisible: "이 계획으로 시작"
- tapOn: "계획 확정"
- extendedWaitUntil:
    visible: "확정된 계획"
    timeout: 10000
- assertVisible: ".*준비 시작.*자동 시작"
