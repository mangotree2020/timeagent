appId: com.ontime.app
name: B-01 플랜 B 근거와 확인 후 적용
tags:
  - smoke
  - android
---
- launchApp:
    clearState: true
    permissions:
      all: deny
      android.permission.ACCESS_FINE_LOCATION: allow
      android.permission.ACCESS_COARSE_LOCATION: allow
- extendedWaitUntil:
    visible: "언제 준비해야 할지.*"
    timeout: 15000
- openLink: "ontime://plan-b"
- extendedWaitUntil:
    visible: "플랜 B"
    timeout: 10000
- assertVisible: "예상값"
- assertVisible: "실시간 교통 조회 전 ON:TIME 기본 추정치"
- scrollUntilVisible:
    element:
      text: ".*변경 내용 확인"
    direction: DOWN
- tapOn: ".*변경 내용 확인"
- assertVisible: "경로 변경 전 확인"
- scrollUntilVisible:
    element:
      text: "이 경로 적용"
    direction: DOWN
- assertVisible: "적용을 눌러야 진행 계획과 알림이 변경됩니다."
- assertVisible: "다시 비교"
- assertVisible: "이 경로 적용"
- tapOn: "다시 비교"
- assertVisible: ".*변경 내용 확인"
